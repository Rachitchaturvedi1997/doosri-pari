# Alembic configuration for Doosri Pari.
#
# The database URL is NOT set here. It is read from python/config.py, which
# reads it from the environment, so there is exactly one place the connection
# string lives and a migration cannot be run against the wrong database by
# editing a file.

[alembic]
script_location = python/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is deliberately blank — python/migrations/env.py supplies it.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
