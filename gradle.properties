# Doosri Pari — Gradle settings.
#
# No org.gradle.java.home here on purpose: Moholla's build hard-codes one
# absolute JDK path, which breaks on any other machine. We rely on JAVA_HOME
# or a JDK on PATH instead.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# The iOS targets are declared but cannot be compiled on Windows. CI builds
# them on a macOS runner; locally we keep the declarations and skip the warning.
kotlin.native.ignoreDisabledTargets=true
