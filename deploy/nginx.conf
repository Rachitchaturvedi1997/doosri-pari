# nginx in front of the API. TLS 1.2+ only; certificates from certbot.
#
#   sudo certbot certonly --nginx -d api.doosripari.in
#
# Two things here matter for the app, not just for hygiene:
#   * X-Forwarded-For is set from $remote_addr, and .env has TRUST_PROXY=true, so
#     the rate limiter sees the real client and not nginx. (If TRUST_PROXY is on
#     with no proxy in front, anyone could pick their own rate-limit identity.)
#   * /ws needs the Upgrade headers or the realtime socket silently never opens.

upstream doosri_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.doosripari.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.doosripari.in;

    ssl_certificate     /etc/letsencrypt/live/api.doosripari.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.doosripari.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 30m;          # local-storage uploads; S3 uploads never touch this

    location /ws {
        proxy_pass http://doosri_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://doosri_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
